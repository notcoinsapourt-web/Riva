name: build-full-backup

on:
  push:
    branches:
      - backup-20260902-1413
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backup branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build self-contained restore bundle
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="fc0e7ae989572a3297079182f729dbf8951ecd21"
          OUT="$RUNNER_TEMP/Riva-Full-Backup-2026-09-02"
          mkdir -p "$OUT/project-source" "$OUT/backup-docs" "$OUT/git"

          # Exact production source snapshot, not the backup-only branch additions.
          git archive "$SOURCE_SHA" | tar -x -C "$OUT/project-source"

          # Human/AI restoration documents created only on the isolated backup branch.
          cp -a backup/. "$OUT/backup-docs/"

          # Full Git history for future forensic restoration.
          git bundle create "$OUT/git/Riva-full-history.bundle" --all

          cat > "$OUT/SOURCE_COMMIT.txt" <<EOF
          Repository: notcoinsapourt-web/Riva
          Production branch: main
          Exact production source commit: $SOURCE_SHA
          Backup branch: backup-20260902-1413
          Generated by GitHub Actions: $GITHUB_RUN_ID
          EOF

          cat > "$OUT/START_HERE_FA.txt" <<'EOF'
          ابتدا backup-docs/README_BACKUP_FA.md را بخوانید.
          سپس برای تحویل پروژه به هوش مصنوعی یا توسعه‌دهنده:
          backup-docs/MASTER_RESTORE_PROMPT_FA.md
          و برای اجرای مرحله‌به‌مرحله:
          backup-docs/RESTORE_GUIDE_FA.md

          project-source/ کپی دقیق سورس Production در Commit مرجع است.
          git/Riva-full-history.bundle برای بازیابی Git history است.
          EOF

          cd "$RUNNER_TEMP"
          zip -q -r "Riva-Full-Backup-2026-09-02.zip" "Riva-Full-Backup-2026-09-02"
          sha256sum "Riva-Full-Backup-2026-09-02.zip" > "Riva-Full-Backup-2026-09-02.sha256"

      - name: Upload backup ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Riva-Full-Backup-2026-09-02
          path: |
            ${{ runner.temp }}/Riva-Full-Backup-2026-09-02.zip
            ${{ runner.temp }}/Riva-Full-Backup-2026-09-02.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
